<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Market</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#ddd;font-family:Arial,Helvetica,sans-serif}
header{background:#080808;border-bottom:1px solid #333;padding:14px 18px;position:sticky;top:0;z-index:5}
.top{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}.logo{font-size:23px;font-weight:bold;color:#eee}
nav{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}button,.btn{background:#222;border:1px solid #555;color:#ddd;padding:9px 13px;border-radius:4px;cursor:pointer}
button:hover,.btn:hover{background:#333}.container{max-width:1100px;margin:auto;padding:20px}
.hero{background:#171717;border:1px solid #333;padding:24px;margin-bottom:18px}.hero h1{margin:0 0 8px;color:#fff}.hero p{color:#999}
.search{display:flex;gap:8px;margin:15px 0}.search input{flex:1}
input,textarea,select{width:100%;background:#0d0d0d;border:1px solid #444;color:#ddd;padding:10px;border-radius:4px;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:#171717;border:1px solid #333;padding:12px}.card img{width:100%;height:170px;object-fit:cover;background:#222}.card h3{margin:10px 0 5px;color:#fff}.price{font-size:18px;color:#eee;font-weight:bold}.stock{font-size:12px;color:#888}.card .actions{display:flex;gap:6px;margin-top:10px}.card button{flex:1}
.panel{background:#171717;border:1px solid #333;padding:18px;margin-top:15px}.hidden{display:none!important}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{background:#202020;border:1px solid #444;padding:10px;margin:10px 0;color:#bbb}
.cart-item{display:flex;justify-content:space-between;border-bottom:1px solid #333;padding:10px 0;gap:10px}.total{font-size:20px;text-align:right;margin-top:15px;color:#fff}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border:1px solid #333;text-align:left;font-size:14px}th{background:#0d0d0d}
footer{text-align:center;border-top:1px solid #333;color:#666;padding:20px;margin-top:30px;font-size:12px}

.payment-box{background:#fff;color:#111;border:1px solid #444;padding:16px;margin:12px 0}
.btc-address{word-break:break-all;background:#f7f7f7;color:#111;border:1px solid #444;padding:12px;margin:10px 0;color:#fff;font-family:monospace;font-size:14px}
.qr-wrap{text-align:center;padding:14px 0}
.btc-qr{width:260px;max-width:80vw;height:auto;background:#fff;padding:8px;border:1px solid #555}
@media(max-width:600px){.row{grid-template-columns:1fr}.top{align-items:flex-start}.logo{font-size:19px}.container{padding:12px}.hero{padding:17px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.card img{height:125px}.card{padding:8px}.card h3{font-size:14px}}

/* === Dark Market Animated Theme === */
:root{
  --bg:#07090d; --panel:#0d1118; --panel2:#111722; --line:#273142;
  --text:#f4f7fb; --muted:#8e9aaa; --accent:#ff2635; --accent2:#ff5965;
}
body{
  background:
    radial-gradient(circle at 15% 10%,rgba(255,38,53,.10),transparent 28%),
    radial-gradient(circle at 85% 35%,rgba(72,100,255,.08),transparent 30%),
    linear-gradient(120deg,#05070a,#0b0f15 50%,#06080b);
  color:var(--text);
  background-size:180% 180%;
  animation:bgMove 12s ease-in-out infinite alternate;
}
@keyframes bgMove{0%{background-position:0% 0%}100%{background-position:100% 100%}}
header{
  background:rgba(5,7,10,.88)!important;
  backdrop-filter:blur(14px);
  box-shadow:0 8px 35px rgba(0,0,0,.35);
}
.logo{
  position:relative;
  letter-spacing:1px;
  text-shadow:0 0 16px rgba(255,38,53,.25);
  animation:logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse{50%{text-shadow:0 0 25px rgba(255,38,53,.48)}}
button,.btn{
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease;
}
button:hover,.btn:hover{
  transform:translateY(-2px);
  border-color:#68758a;
  box-shadow:0 7px 22px rgba(0,0,0,.35);
}
button:active{transform:scale(.97)}
.hero,.panel,.card{
  background:linear-gradient(145deg,rgba(18,23,32,.94),rgba(9,12,17,.96))!important;
  border-color:var(--line)!important;
  box-shadow:0 15px 40px rgba(0,0,0,.18);
}
.card{overflow:hidden;position:relative}
.card:before{
  content:"";position:absolute;inset:-1px;
  background:linear-gradient(120deg,transparent,rgba(255,38,53,.13),transparent);
  transform:translateX(-110%);transition:transform .7s;
  pointer-events:none;
}
.card:hover:before{transform:translateX(110%)}
.card img{transition:transform .45s ease,filter .45s ease}
.card:hover img{transform:scale(1.04);filter:brightness(1.08)}
.payment-box{
  background:linear-gradient(145deg,#fff,#f3f6fb)!important;
  color:#111!important;
  border:1px solid #dce2eb!important;
  box-shadow:0 15px 45px rgba(0,0,0,.25);
  animation:cardIn .55s ease both;
}
.payment-box .notice{color:#17304f;background:#eef6ff;border-color:#cfe2fa}
.btc-address{color:#111!important}
.btc-qr{box-shadow:0 8px 25px rgba(0,0,0,.14);animation:qrFloat 3s ease-in-out infinite}
@keyframes qrFloat{50%{transform:translateY(-5px)}}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* icon buttons */
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.icon{width:19px;height:19px;display:inline-block;vertical-align:middle}
.icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.section-title{display:flex;align-items:center;gap:9px}
.badge-live{
 display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#ff6c76;
 border:1px solid #4d2026;border-radius:20px;padding:5px 9px;background:#170b0d
}
.badge-live i{width:6px;height:6px;border-radius:50%;background:#ff2635;box-shadow:0 0 10px #ff2635;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
footer{background:#07090d;position:relative;overflow:hidden}
footer:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,#ff2635,transparent);animation:lineMove 3s linear infinite}
@keyframes lineMove{0%{transform:translateX(-40%)}100%{transform:translateX(40%)}}
@media(max-width:600px){
 .top{padding-bottom:3px}
 nav button{min-width:88px}
 .hero{animation:cardIn .5s ease both}
}

</style>
</head>
